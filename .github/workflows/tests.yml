name: tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash tests/run_tests.sh
      - run: python3 scripts/validate_prompt.py examples/production/30s-fight-t2v.prompt.md --production-record examples/production/30s-fight-t2v.production.json --require-ready
